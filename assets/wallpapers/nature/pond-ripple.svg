<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Pond ripple">
  <style>
    .p { transform-origin: 120px 170px; animation: rip 4.8s ease-out infinite; fill: none; stroke: #7de3f4; stroke-width: 2; }
    .p2 { animation-delay: -1.6s; stroke: #124191; }
    .p3 { animation-delay: -3.2s; }
    @keyframes rip { from { transform: scale(0.15); opacity: 0.8; } to { transform: scale(1.5); opacity: 0; } }
  </style>
  <rect width="240" height="320" fill="#07141c"/>
  <rect y="140" width="240" height="180" fill="#0b3040"/>
  <circle class="p" cx="120" cy="170" r="70"/>
  <circle class="p p2" cx="120" cy="170" r="70"/>
  <circle class="p p3" cx="120" cy="170" r="70"/>
</svg>
