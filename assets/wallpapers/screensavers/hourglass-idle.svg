<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Hourglass idle">
  <style>
    .sand { animation: drain 5s ease-in-out infinite; }
    .grain { animation: drop 0.7s linear infinite; }
    @keyframes drain {
      0%,100% { transform: scaleY(1); }
      50% { transform: scaleY(0.25); }
    }
    @keyframes drop { from { transform: translateY(0); opacity: 1; } to { transform: translateY(70px); opacity: 0.2; } }
  </style>
  <rect width="240" height="320" fill="#0b0f10"/>
  <path d="M70 60 H170 L120 160 L170 260 H70 L120 160 Z" fill="none" stroke="#7de3f4" stroke-width="3"/>
  <rect class="sand" x="88" y="72" width="64" height="70" fill="#c9a15b" style="transform-origin: 120px 142px"/>
  <rect x="88" y="188" width="64" height="58" fill="#8a6a32"/>
  <rect class="grain" x="118" y="155" width="4" height="10" fill="#e3c27a"/>
</svg>
