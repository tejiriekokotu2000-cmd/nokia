<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Pixel rain">
  <style>
    .d { animation: fall 3.2s linear infinite; }
    .d2 { animation-duration: 4.1s; animation-delay: -1s; }
    .d3 { animation-duration: 2.6s; animation-delay: -0.4s; }
    @keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(360px); } }
  </style>
  <rect width="240" height="320" fill="#0b0f10"/>
  <g class="d" fill="#7de3f4">
    <rect x="20" y="0" width="12" height="12"/><rect x="92" y="-30" width="12" height="12"/><rect x="164" y="-10" width="12" height="12"/>
  </g>
  <g class="d d2" fill="#124191">
    <rect x="44" y="-20" width="12" height="12"/><rect x="116" y="10" width="12" height="12"/><rect x="188" y="-40" width="12" height="12"/>
  </g>
  <g class="d d3" fill="#f3f5f5">
    <rect x="68" y="-8" width="12" height="12"/><rect x="140" y="-24" width="12" height="12"/><rect x="212" y="4" width="12" height="12"/>
  </g>
</svg>
