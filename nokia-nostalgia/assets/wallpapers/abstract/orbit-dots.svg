<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Orbit dots">
  <style>
    .a { transform-origin: 120px 160px; animation: spin 9s linear infinite; }
    .b { animation: spin 6s linear infinite reverse; }
    .c { animation: spin 4s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <rect width="240" height="320" fill="#0b0f10"/>
  <ellipse cx="120" cy="160" rx="86" ry="54" fill="none" stroke="#2d373a"/>
  <ellipse cx="120" cy="160" rx="54" ry="86" fill="none" stroke="#2d373a"/>
  <g class="a"><circle cx="206" cy="160" r="7" fill="#7de3f4"/></g>
  <g class="b"><circle cx="120" cy="74" r="6" fill="#124191"/></g>
  <g class="c"><circle cx="174" cy="160" r="5" fill="#f3f5f5"/></g>
  <circle cx="120" cy="160" r="4" fill="#a7b0b2"/>
</svg>
