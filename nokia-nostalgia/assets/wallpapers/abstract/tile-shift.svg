<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Tile shift">
  <style>
    .grid { animation: slide 2.4s steps(8) infinite; }
    @keyframes slide { from { transform: translate(0,0); } to { transform: translate(-30px, -30px); } }
  </style>
  <rect width="240" height="320" fill="#0b0f10"/>
  <g class="grid">
    <pattern id="t" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#124191"/>
      <rect x="30" y="30" width="30" height="30" fill="#124191"/>
      <rect x="30" width="30" height="30" fill="#0b0f10"/>
      <rect y="30" width="30" height="30" fill="#151b1d"/>
    </pattern>
    <rect x="-30" y="-30" width="300" height="380" fill="url(#t)"/>
  </g>
</svg>
