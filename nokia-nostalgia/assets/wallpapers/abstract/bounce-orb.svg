<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Bounce orb">
  <style>
    .orb { animation: bounce 1.8s ease-in-out infinite; }
    @keyframes bounce {
      0%,100% { transform: translate(0, 0); }
      50% { transform: translate(0, 168px); }
    }
  </style>
  <rect width="240" height="320" fill="#0b0f10"/>
  <rect x="18" y="18" width="204" height="284" fill="none" stroke="#2d373a"/>
  <circle class="orb" cx="120" cy="52" r="18" fill="#7de3f4"/>
</svg>
