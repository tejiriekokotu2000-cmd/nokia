<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Pixel fish">
  <style>
    .fish { animation: swim 6s linear infinite; }
    @keyframes swim { from { transform: translateX(-80px); } to { transform: translateX(280px); } }
  </style>
  <rect width="240" height="320" fill="#0a2430"/>
  <rect y="250" width="240" height="70" fill="#0b3a2a"/>
  <g class="fish">
    <rect x="0" y="140" width="28" height="16" fill="#7de3f4"/>
    <rect x="28" y="144" width="12" height="8" fill="#124191"/>
    <rect x="6" y="144" width="4" height="4" fill="#0b0f10"/>
  </g>
  <rect x="30" y="40" width="8" height="8" fill="#124191" opacity="0.5"/>
  <rect x="180" y="80" width="8" height="8" fill="#124191" opacity="0.5"/>
</svg>
